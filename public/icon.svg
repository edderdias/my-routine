<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="40%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f2b7a" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="lugGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0369a1" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background App Tile (Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bgGrad)" />
  
  <!-- Subtle inner top highlight -->
  <path d="M 128 28 Q 256 32 384 28 C 440 28 476 64 484 120 C 476 72 436 36 384 34 Q 256 38 128 34 C 76 36 36 72 28 120 C 36 64 72 28 128 28 Z" fill="#ffffff" opacity="0.15" />

  <!-- Calendar Base Card -->
  <g filter="url(#shadow)">
    <rect x="94" y="116" width="324" height="290" rx="44" ry="44" fill="#ffffff" />
    
    <!-- Calendar Inner Top Header -->
    <path d="M 94 160 C 94 135 115 116 140 116 L 372 116 C 397 116 418 135 418 160 L 418 184 L 94 184 Z" fill="url(#headerGrad)" />
    
    <!-- Calendar Body Inset / Area -->
    <rect x="118" y="206" width="276" height="176" rx="24" ry="24" fill="#f8fafc" />

    <!-- Calendar Grid Items (2 rows of 3 blocks) -->
    <!-- Row 1 -->
    <rect x="144" y="234" width="46" height="42" rx="10" fill="#3b82f6" opacity="0.85" />
    <rect x="214" y="234" width="46" height="42" rx="10" fill="#3b82f6" opacity="0.85" />
    <rect x="284" y="234" width="46" height="42" rx="10" fill="#3b82f6" opacity="0.85" />
    
    <!-- Row 2 -->
    <rect x="144" y="298" width="46" height="42" rx="10" fill="#3b82f6" opacity="0.85" />
    <rect x="214" y="298" width="46" height="42" rx="10" fill="#3b82f6" opacity="0.85" />
    <rect x="284" y="298" width="46" height="42" rx="10" fill="#3b82f6" opacity="0.45" />

    <!-- Calendar Ring Lugs (Top) -->
    <rect x="160" y="86" width="34" height="64" rx="17" fill="url(#lugGrad)" />
    <rect x="160" y="86" width="34" height="64" rx="17" fill="none" stroke="#1d4ed8" stroke-width="3" opacity="0.3" />
    
    <rect x="318" y="86" width="34" height="64" rx="17" fill="url(#lugGrad)" />
    <rect x="318" y="86" width="34" height="64" rx="17" fill="none" stroke="#1d4ed8" stroke-width="3" opacity="0.3" />
  </g>

  <!-- Cyan Circular Checkmark Badge -->
  <g filter="url(#badgeShadow)">
    <circle cx="366" cy="358" r="86" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="12" />
    <!-- White Checkmark -->
    <path d="M 326 358 L 354 386 L 410 326" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
